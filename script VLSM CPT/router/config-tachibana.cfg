! ==========================================
! Router: Tachibana
! Topologi: Cisco Packet Tracer (VLSM)
! ==========================================
enable
configure terminal
hostname Tachibana

! Interface ke Switch9 (Subnet A9: Collective, Ghost)
interface FastEthernet0/0
 ip address 10.66.10.1 255.255.254.0
 duplex auto
 speed auto
 no shutdown
exit

! Serial link ke Wired (Subnet A4: DTE side)
interface Serial0/0/0
 ip address 10.66.16.66 255.255.255.252
 no shutdown
exit

! Serial link ke Deus (Subnet A10: DCE side)
interface Serial0/0/1
 ip address 10.66.16.69 255.255.255.252
 clock rate 128000
 no shutdown
exit

! Dynamic Routing: OSPF Area 0
router ospf 1
 log-adjacency-changes
 network 10.66.0.0 0.0.31.255 area 0
exit

! Static Routing fallback
ip route 0.0.0.0 0.0.0.0 10.66.16.65
ip route 10.66.14.128 255.255.255.128 10.66.16.70
ip route 10.66.15.128 255.255.255.192 10.66.16.70
ip route 10.66.16.48 255.255.255.248 10.66.16.70
ip route 10.66.16.0 255.255.255.224 10.66.16.70
ip route 10.66.15.0 255.255.255.192 10.66.16.70

exit
write memory
