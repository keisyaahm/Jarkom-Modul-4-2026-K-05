! ==========================================
! Router: Protocol7
! Topologi: Cisco Packet Tracer (VLSM)
! ==========================================
enable
configure terminal
hostname Protocol7

! Interface ke Switch11 (Subnet A13: Chisa, Hodgeson)
interface FastEthernet0/0
 ip address 10.66.15.129 255.255.255.192
 duplex auto
 speed auto
 no shutdown
exit

! Serial link ke Deus (Subnet A12: DTE side)
interface Serial0/0/0
 ip address 10.66.16.74 255.255.255.252
 no shutdown
exit

! Serial link ke Knights (Subnet A14: DCE side)
interface Serial0/0/1
 ip address 10.66.16.77 255.255.255.252
 clock rate 128000
 no shutdown
exit

! Dynamic Routing: OSPF Area 0
router ospf 1
 log-adjacency-changes
 network 10.66.0.0 0.0.31.255 area 0
exit

! Static Routing fallback
ip route 0.0.0.0 0.0.0.0 10.66.16.73
ip route 10.66.16.48 255.255.255.248 10.66.16.78
ip route 10.66.16.0 255.255.255.224 10.66.16.78
ip route 10.66.15.0 255.255.255.192 10.66.16.78

exit
write memory
