! ==========================================
! Router: Shibuya
! Topologi: Cisco Packet Tracer (VLSM)
! ==========================================
enable
configure terminal
hostname Shibuya

! Interface ke Switch13 (Subnet A19: Lain, Mika)
interface FastEthernet0/0
 ip address 10.66.15.1 255.255.255.192
 duplex auto
 speed auto
 no shutdown
exit

! Serial link ke Phantoma (Subnet A18: DTE side)
interface Serial0/0/0
 ip address 10.66.16.86 255.255.255.252
 no shutdown
exit

! Dynamic Routing: OSPF Area 0
router ospf 1
 log-adjacency-changes
 network 10.66.0.0 0.0.31.255 area 0
exit

! Static Routing fallback
ip route 0.0.0.0 0.0.0.0 10.66.16.85

exit
write memory
