! ==========================================
! Router: Wired
! Topologi: Cisco Packet Tracer (VLSM)
! ==========================================
enable
configure terminal
hostname Wired

! Interface ke Switch2 (Subnet A5: Multi-router Psyche, Copland, Schumann)
interface FastEthernet0/0
 ip address 10.66.16.34 255.255.255.248
 duplex auto
 speed auto
 no shutdown
exit

! Serial link ke Cyberia (Subnet A2: DTE side)
interface Serial0/0/0
 ip address 10.66.16.58 255.255.255.252
 no shutdown
exit

! Serial link ke Navi (Subnet A3: DCE side)
interface Serial0/0/1
 ip address 10.66.16.61 255.255.255.252
 clock rate 2000000
 no shutdown
exit

! Serial link ke Tachibana (Subnet A4: DCE side)
interface Serial0/1/0
 ip address 10.66.16.65 255.255.255.252
 clock rate 2000000
 no shutdown
exit

! Dynamic Routing: OSPF Area 0
router ospf 1
 log-adjacency-changes
 network 10.66.0.0 0.0.31.255 area 0
exit

exit
write memory
