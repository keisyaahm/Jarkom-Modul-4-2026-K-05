! ==========================================
! Router: Phantoma
! Topologi: Cisco Packet Tracer (VLSM)
! ==========================================
enable
configure terminal
hostname Phantoma

! Interface ke Switch12 (Subnet A17: Semi)
interface FastEthernet0/0
 ip address 10.66.16.1 255.255.255.224
 duplex auto
 speed auto
 no shutdown
exit

! Serial link ke Knights (Subnet A16: DTE side)
interface Serial0/0/0
 ip address 10.66.16.82 255.255.255.252
 no shutdown
exit

! Serial link ke Shibuya (Subnet A18: DCE side)
interface Serial0/0/1
 ip address 10.66.16.85 255.255.255.252
 clock rate 128000
 no shutdown
exit

! Dynamic Routing: OSPF Area 0
router ospf 1
 log-adjacency-changes
 network 10.66.0.0 0.0.31.255 area 0
exit

! Static Routing fallback
ip route 0.0.0.0 0.0.0.0 10.66.16.81
ip route 10.66.15.0 255.255.255.192 10.66.16.86

exit
write memory
