! ==========================================
! Router: Cyberia
! Topologi: Cisco Packet Tracer (VLSM)
! ==========================================
enable
configure terminal
hostname Cyberia

! Interface ke Switch1 (Subnet A1: JJ, MyuMyu)
interface FastEthernet0/0
 ip address 10.66.14.1 255.255.255.128
 duplex auto
 speed auto
 no shutdown
exit

! Serial link ke Wired (Subnet A2: DCE side)
interface Serial0/0/0
 ip address 10.66.16.57 255.255.255.252
 clock rate 128000
 no shutdown
exit

! Dynamic Routing: OSPF Area 0
router ospf 1
 log-adjacency-changes
 network 10.66.0.0 0.0.31.255 area 0
exit

! Static Routing fallback
ip route 0.0.0.0 0.0.0.0 10.66.16.58

exit
write memory
