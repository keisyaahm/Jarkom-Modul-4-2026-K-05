! ==========================================
! Router: Navi
! Topologi: Cisco Packet Tracer (VLSM)
! ==========================================
enable
configure terminal
hostname Navi

! Interface ke Switch6 (Subnet A6: Alice, Reika)
interface FastEthernet0/0
 ip address 10.66.12.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
exit

! Interface ke Switch7 (Subnet A7: Taro)
interface FastEthernet0/1
 ip address 10.66.15.65 255.255.255.192
 duplex auto
 speed auto
 no shutdown
exit

! Serial link ke Wired (Subnet A3: DTE side)
interface Serial0/0/0
 ip address 10.66.16.62 255.255.255.252
 no shutdown
exit

! Switch Module NM-ESW-16 ke Switch8 (Subnet A8: Yasuo, Miho, Kuma)
interface Vlan1
 ip address 10.66.13.1 255.255.255.0
 no shutdown
exit

! Dynamic Routing: OSPF Area 0
router ospf 1
 log-adjacency-changes
 network 10.66.0.0 0.0.31.255 area 0
exit

! Static Routing fallback
ip route 0.0.0.0 0.0.0.0 10.66.16.61

exit
write memory
