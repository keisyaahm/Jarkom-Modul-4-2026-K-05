! ==========================================
! Router: Accela
! Topologi: Cisco Packet Tracer (VLSM)
! ==========================================
enable
configure terminal
hostname Accela

! Interface ke Switch5 (Subnet A25: OmniPresence, Denpa)
interface FastEthernet0/0
 ip address 10.66.4.1 255.255.252.0
 duplex auto
 speed auto
 no shutdown
exit

! Serial link ke Schumann (Subnet A24: DTE side)
interface Serial0/0/0
 ip address 10.66.16.90 255.255.255.252
 no shutdown
exit

! Dynamic Routing: OSPF Area 0
router ospf 1
 log-adjacency-changes
 network 10.66.0.0 0.0.31.255 area 0
exit

! Static Routing fallback
ip route 0.0.0.0 0.0.0.0 10.66.16.89

exit
write memory
