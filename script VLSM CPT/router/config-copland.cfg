! ==========================================
! Router: Copland
! Topologi: Cisco Packet Tracer (VLSM)
! ==========================================
enable
configure terminal
hostname Copland

! Interface ke Switch2 (Subnet A5: Multi-router bersama)
interface FastEthernet0/0
 ip address 10.66.16.35 255.255.255.248
 duplex auto
 speed auto
 no shutdown
exit

! Interface ke Switch4 (Subnet A21: Masayuki)
interface FastEthernet0/1
 ip address 10.66.8.1 255.255.254.0
 duplex auto
 speed auto
 no shutdown
exit

! Interface NM-ESW-16 VLAN1 direct ke Juri (Subnet A22)
interface Vlan1
 ip address 10.66.15.193 255.255.255.192
 no shutdown
exit

! Dynamic Routing: OSPF Area 0
router ospf 1
 log-adjacency-changes
 network 10.66.0.0 0.0.31.255 area 0
exit

! Static Routing fallback
ip route 0.0.0.0 0.0.0.0 10.66.16.33

exit
write memory
