! ==========================================
! Router: Knights
! Topologi: Cisco Packet Tracer (VLSM)
! ==========================================
enable
configure terminal
hostname Knights

! Interface direct ke Eiri (Subnet A15)
interface FastEthernet0/0
 ip address 10.66.16.49 255.255.255.248
 duplex auto
 speed auto
 no shutdown
exit

! Serial link ke Protocol7 (Subnet A14: DTE side)
interface Serial0/0/0
 ip address 10.66.16.78 255.255.255.252
 no shutdown
exit

! Serial link ke Phantoma (Subnet A16: DCE side)
interface Serial0/0/1
 ip address 10.66.16.81 255.255.255.252
 clock rate 128000
 no shutdown
exit

! Dynamic Routing: OSPF Area 0
router ospf 1
 log-adjacency-changes
 network 10.66.0.0 0.0.31.255 area 0
exit

! Static Routing fallback
ip route 0.0.0.0 0.0.0.0 10.66.16.77
ip route 10.66.16.0 255.255.255.224 10.66.16.82
ip route 10.66.15.0 255.255.255.192 10.66.16.82

exit
write memory
