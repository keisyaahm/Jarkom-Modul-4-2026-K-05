! ==========================================
! Router: Schumann
! Topologi: Cisco Packet Tracer (VLSM)
! ==========================================
enable
configure terminal
hostname Schumann

! Interface ke Switch2 (Subnet A5: Multi-router bersama)
interface FastEthernet0/0
 ip address 10.66.16.36 255.255.255.248
 duplex auto
 speed auto
 no shutdown
exit

! Interface direct ke Akashic (Subnet A23)
interface FastEthernet0/1
 ip address 10.66.16.41 255.255.255.248
 duplex auto
 speed auto
 no shutdown
exit

! Serial link ke Accela (Subnet A24: DCE side)
interface Serial0/0/0
 ip address 10.66.16.89 255.255.255.252
 clock rate 128000
 no shutdown
exit

! Dynamic Routing: OSPF Area 0
router ospf 1
 log-adjacency-changes
 network 10.66.0.0 0.0.31.255 area 0
exit

! Static Routing fallback
ip route 0.0.0.0 0.0.0.0 10.66.16.33
ip route 10.66.4.0 255.255.252.0 10.66.16.90

exit
write memory
