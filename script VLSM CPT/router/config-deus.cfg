! ==========================================
! Router: Deus
! Topologi: Cisco Packet Tracer (VLSM)
! ==========================================
enable
configure terminal
hostname Deus

! Interface ke Switch10 (Subnet A11: Lillith, Specter)
interface FastEthernet0/0
 ip address 10.66.14.129 255.255.255.128
 duplex auto
 speed auto
 no shutdown
exit

! Serial link ke Tachibana (Subnet A10: DTE side)
interface Serial0/0/0
 ip address 10.66.16.70 255.255.255.252
 no shutdown
exit

! Serial link ke Protocol7 (Subnet A12: DCE side)
interface Serial0/0/1
 ip address 10.66.16.73 255.255.255.252
 clock rate 128000
 no shutdown
exit

! Dynamic Routing: OSPF Area 0
router ospf 1
 log-adjacency-changes
 network 10.66.0.0 0.0.31.255 area 0
exit

! Static Routing fallback
ip route 0.0.0.0 0.0.0.0 10.66.16.69
ip route 10.66.15.128 255.255.255.192 10.66.16.74
ip route 10.66.16.48 255.255.255.248 10.66.16.74
ip route 10.66.16.0 255.255.255.224 10.66.16.74
ip route 10.66.15.0 255.255.255.192 10.66.16.74

exit
write memory
